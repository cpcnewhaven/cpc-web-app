{% extends "admin/model/list.html" %}

{% block model_list_table %}
<div class="new-entry-widget">
  <div><span class="new-entry-eyebrow">Announcements</span><strong>Create something new</strong></div>
  <a class="content-new-entry" href="{{ url_for('announcement.create_view', url='/admin/announcement/') }}">New announcement</a>
</div>
<div class="advanced-toggle-section">
  <button class="advanced-toggle-btn" id="advancedToggle">Show Advanced Fields</button>
</div>
<div class="announcement-bulk-bar" id="announcementBulkBar" aria-live="polite" hidden>
  <div class="announcement-bulk-summary"><strong id="announcementSelectedCount">0</strong> announcements selected</div>
  <div class="announcement-bulk-help">Choose an action to update the selected records.</div>
  <button type="button" class="announcement-bulk-actions" id="announcementBulkActions">Bulk actions <span aria-hidden="true">⌄</span></button>
  <button type="button" class="announcement-bulk-clear" id="announcementBulkClear">Clear selection</button>
</div>
<div id="announcementTableShell">
  {{ super() }}
</div>

<script>
  (function() {
    const shell = document.getElementById('announcementTableShell');
    const table = shell && shell.querySelector('table.model-list');
    if (!table) return;
    table.id = 'announcementTable';
    table.classList.add('admin-list', 'basic-view');

    const bulkBar = document.getElementById('announcementBulkBar');
    const selectedCount = document.getElementById('announcementSelectedCount');
    const bulkToggle = document.querySelector('.actions-nav > li.dropdown .btn.dropdown-toggle');
    const rowChecks = function() { return Array.from(table.querySelectorAll('input.action-checkbox')); };
    function refreshBulkBar() {
      const count = rowChecks().filter(function(input) { return input.checked; }).length;
      if (selectedCount) selectedCount.textContent = count;
      if (bulkBar) bulkBar.hidden = count === 0;
      if (bulkToggle) {
        bulkToggle.innerHTML = count ? 'Bulk actions (' + count + ')<b class="caret"></b>' : 'With selected<b class="caret"></b>';
        bulkToggle.setAttribute('aria-label', count ? 'Bulk actions for ' + count + ' selected announcements' : 'Bulk actions');
      }
    }
    table.addEventListener('change', function(event) {
      if (event.target.matches('input[type="checkbox"]')) refreshBulkBar();
    });
    document.getElementById('announcementBulkClear')?.addEventListener('click', function() {
      rowChecks().forEach(function(input) { input.checked = false; });
      const selectAll = table.querySelector('input.action-rowtoggle');
      if (selectAll) selectAll.checked = false;
      refreshBulkBar();
    });
    document.getElementById('announcementBulkActions')?.addEventListener('click', function() {
      if (bulkToggle) bulkToggle.click();
    });
    refreshBulkBar();

    function quarterFor(year, month) {
      return year + ' Q' + (Math.floor((month - 1) / 3) + 1);
    }
    function quarterRange(year, quarter) {
      const starts = ['01-01', '04-01', '07-01', '10-01'];
      const ends = ['03-31', '06-30', '09-30', '12-31'];
      return year + '-' + starts[quarter - 1] + ' — ' + year + '-' + ends[quarter - 1];
    }

    // Always lead with the current quarter, even before its first announcement is created.
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentQuarter = Math.floor(now.getMonth() / 3) + 1;
    const currentGroup = quarterFor(currentYear, now.getMonth() + 1);
    const dataRows = Array.from(table.querySelectorAll('tbody tr')).filter(function(row) {
      return row.querySelector('.col-title');
    });
    const hasCurrentQuarter = dataRows.some(function(row) {
      const dateCell = row.querySelector('.col-date_entered');
      const match = dateCell && dateCell.textContent.match(/(20\d{2})-(\d{2})-(\d{2})/);
      return match && quarterFor(Number(match[1]), Number(match[2])) === currentGroup;
    });
    if (!hasCurrentQuarter && dataRows.length) {
      const divider = document.createElement('tr');
      divider.className = 'announcement-quarter-row announcement-quarter-current';
      const cell = document.createElement('th');
      cell.colSpan = table.rows[0].cells.length;
      cell.scope = 'colgroup';
      const label = document.createElement('span');
      label.className = 'announcement-quarter-label';
      label.textContent = currentGroup;
      cell.appendChild(label);
      const range = document.createElement('span');
      range.className = 'announcement-quarter-range';
      range.textContent = quarterRange(currentYear, currentQuarter);
      cell.appendChild(range);
      const badge = document.createElement('span');
      badge.className = 'announcement-quarter-badge';
      badge.textContent = 'Current quarter';
      cell.appendChild(badge);
      divider.appendChild(cell);
      dataRows[0].parentNode.insertBefore(divider, dataRows[0]);
    }

    let previousGroup = null;
    Array.from(table.querySelectorAll('tr')).slice(1).forEach(function(row) {
      const dateCell = row.querySelector('.col-date_entered');
      if (!dateCell && !row.querySelector('.col-title')) return;
      const match = dateCell && dateCell.textContent.match(/(20\d{2})-(\d{2})-(\d{2})/);
      const group = match ? quarterFor(Number(match[1]), Number(match[2])) : 'Undated';
      if (row.classList.contains('announcement-quarter-current')) {
        previousGroup = currentGroup;
        return;
      }
      if (group === previousGroup) return;
      previousGroup = group;

      const divider = document.createElement('tr');
      divider.className = 'announcement-quarter-row';
      const cell = document.createElement('th');
      cell.colSpan = table.rows[0].cells.length;
      cell.scope = 'colgroup';
      const label = document.createElement('span');
      label.className = 'announcement-quarter-label';
      label.textContent = group;
      cell.appendChild(label);
      if (match) {
        const quarter = Math.floor((Number(match[2]) - 1) / 3) + 1;
        const range = document.createElement('span');
        range.className = 'announcement-quarter-range';
        range.textContent = quarterRange(Number(match[1]), quarter);
        cell.appendChild(range);
      }
      divider.appendChild(cell);
      row.parentNode.insertBefore(divider, row);
    });

    const toggleBtn = document.getElementById('advancedToggle');
    if (toggleBtn) {
      const savedMode = localStorage.getItem('announcementViewMode');
      if (savedMode === 'advanced') {
        table.classList.remove('basic-view');
        toggleBtn.classList.add('active');
        toggleBtn.textContent = 'Show Basic Fields';
      }
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        table.classList.toggle('basic-view');
        this.classList.toggle('active');
        const advanced = this.classList.contains('active');
        this.textContent = advanced ? 'Show Basic Fields' : 'Show Advanced Fields';
        localStorage.setItem('announcementViewMode', advanced ? 'advanced' : 'basic');
      });
    }
  })();
</script>
{% endblock %}
